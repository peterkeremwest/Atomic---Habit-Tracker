<!doctype html>
<html lang="en" data-theme="green">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050805">
<meta name="description" content="Atomic — habits and tasks, one atom at a time.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Atomic">
<title>Atomic</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" href="./icons/favicon-64.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="preload" href="./vendor/fonts/vt323.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="./css/theme.css">
</head>
<body class="scan">
<div id="app">
  <header class="top">
    <h1 class="vt glow" aria-label="Atomic"><span class="typed" aria-hidden="true">ATOMIC</span><span class="cursor" role="status"></span></h1>
    <button class="hsearch vt" aria-label="Search everything">⌕ SEARCH</button>
  </header>
  <div id="daybar"></div>
  <div class="quick hidden">
    <form autocomplete="off">
      <span class="prompt vt glow" aria-hidden="true">&gt;</span>
      <input name="q" enterkeyhint="done" maxlength="160" aria-label="Quick add. Tap the question mark for examples." placeholder="#fitness workout mon wed fri">
      <button class="btn vt" type="button" data-x="help" aria-label="What you can type">?</button>
      <button class="btn vt" type="button" data-x="full" aria-label="Open full editor">+</button>
    </form>
  </div>
  <main><p class="dim vt" style="font-size:22px">&gt; booting…</p></main>
</div>


<nav class="tabs vt" aria-label="Screens">
  <div>
    <a href="#/today" data-route="today">TODAY</a>
    <a href="#/calendar" data-route="calendar">CALENDAR</a>
    <a href="#/habits" data-route="habits">HABITS</a>
    <a href="#/elements" data-route="elements">CATEGORIES</a>
    <a href="#/sys" data-route="sys">SETTINGS</a>
  </div>
</nav>

<dialog id="sheet" class="sheet" aria-label="Details"><div class="inner"></div></dialog>
<div id="toast" role="status"></div>
<script type="module" src="./js/app.js"></script>
</body>
</html>
