<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050805">
<title>Atomic</title>
<style>
  :root { --bg:#050805; --fg:#33ff66; --dim:#1f7a3a; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family:"Courier New",Courier,monospace; }
  main { max-width:560px; margin:0 auto; padding:48px 20px; }
  h1 { font-size:2rem; letter-spacing:.3em; margin:0 0 8px; text-shadow:0 0 8px rgba(51,255,102,.5); }
  p { color:var(--dim); margin:4px 0; }
  .cursor { display:inline-block; width:.6em; background:var(--fg); animation:b 1s steps(1) infinite; }
  @keyframes b { 50% { opacity:0; } }
</style>
</head>
<body>
<main>
  <h1>ATOMIC</h1>
  <p>&gt; v0.1 // system initialized</p>
  <p>&gt; hosting online. app build pending<span class="cursor">&nbsp;</span></p>
</main>
</body>
</html>
